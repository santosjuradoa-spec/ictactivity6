<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 3 | Santos Profile</title>
    <style>
        :root {
            --sand: #f6e8d6;
            --olive: #59735d;
            --panel: #fffdf9;
            --accent: #a96d4d;
            --text: #2b2a2a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, var(--sand), #fffaf4);
            color: var(--text);
        }

        .container {
            width: min(760px, 90vw);
            background: var(--panel);
            border-radius: 18px;
            padding: 32px 28px 40px;
            box-shadow: 0 12px 28px rgba(89, 115, 93, 0.14);
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--olive);
            background: #f2f6f0;
            text-decoration: none;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 999px;
        }

        nav a:hover,
        nav a:focus-visible {
            background: #eaf0ea;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: var(--olive);
            font-size: clamp(2rem, 4vw, 3rem);
        }

        h2 {
            margin: 0 0 8px;
            text-align: center;
            color: #8b5b46;
            font-size: 1.6rem;
        }

        h3 {
            margin: 0 0 18px;
            text-align: center;
            color: #3d452f;
            font-size: 1.2rem;
        }

        .card {
            padding: 18px 20px;
            border-left: 5px solid var(--accent);
            background: #fff7f1;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <a href="page1.html">Page 1</a>
            <a href="page2.html">Page 2</a>
            <a href="page3.html">Page 3</a>
        </nav>

        <h1>SANTOS</h1>
        <h2>JERRY</h2>
        <h3>JURADO</h3>

        <div class="card">
            <strong>Favorite Food:</strong> Pizza.<br>
            Pizza is my favorite food of all time because it is comforting, delicious, and fun to share with others.
        </div>
    </main>
</body>
</html>
