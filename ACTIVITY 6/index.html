<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: #dff2df;
            color: #24392b;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: min(100%, 400px);
            padding: 40px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 36px rgba(36, 57, 43, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .intro {
            margin: 0 0 28px;
            color: #657568;
            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 11px 12px;
            border: 1px solid #cbd8ca;
            border-radius: 7px;
            color: inherit;
            font: inherit;
        }

        input:focus {
            border-color: #4d8050;
            outline: 3px solid rgba(77, 128, 80, 0.2);
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 6px;
            border: 0;
            border-radius: 7px;
            background: #4d8050;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover {
            background: #3d6940;
        }

        button:focus-visible {
            outline: 3px solid #24392b;
            outline-offset: 3px;
        }

        .status {
            min-height: 1.4em;
            margin: 16px 0 0;
            color: #3d6940;
            text-align: center;
        }

        @media (max-width: 420px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Welcome back</h1>
        <p class="intro">Please enter your username and password.</p>

        <form id="login-form">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button type="submit">Log in</button>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();
            document.getElementById('status').textContent =
                'This demo form is not connected to an account.';
        });
    </script>
</body>
</html>
